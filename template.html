<!doctype html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} — {{title_suffix}}</title>
<meta name="description" content="{{tagline}}">
<link rel="alternate" hreflang="en" href="https://wihansaem1991.github.io/">
<link rel="alternate" hreflang="ko" href="https://wihansaem1991.github.io/ko/">
<script>document.documentElement.classList.add("js");</script>
<style>
  :root { --fg:#1d2433; --muted:#5b6475; --line:#e3e7ee; --accent:#1f6feb; --ok:#1a7f37; --merged:#8250df; --warn:#9a6700; --bad:#cf222e; --bg:#ffffff; --card:#f7f9fc; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6e9ef; --muted:#9aa3b2; --line:#2a313c; --accent:#58a6ff; --ok:#3fb950; --merged:#a371f7; --warn:#d29922; --bad:#f85149; --bg:#0f1419; --card:#161b22; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 40px 20px 64px; }
  header { position: relative; }
  .lang { position:absolute; top:0; right:0; font-size:14px; }
  header h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; padding-right: 80px; }
  header p { margin: 0; color: var(--muted); font-size: 15px; }
  .tags { margin: 12px 0 0; display:flex; flex-wrap:wrap; gap:6px; padding:0; list-style:none; }
  .tags li { border:1px solid var(--line); border-radius:999px; padding:1px 10px; font-size:12px; color:var(--muted); }
  .summary { margin-top:20px; font-size:15px; }
  .live { color:var(--muted); font-size:13px; }
  .tabbar { position: sticky; top: 0; z-index: 2; background: var(--bg); margin: 16px -20px 0; padding: 10px 20px;
            display:flex; gap:8px; overflow-x:auto; border-bottom:1px solid var(--line); scrollbar-width: none; }
  .tab { flex: none; font: inherit; font-size:14px; color:var(--fg); background:var(--card); border:1px solid var(--line);
         border-radius:999px; padding:6px 14px; cursor:pointer; white-space:nowrap; }
  .tab .count { color:var(--muted); font-weight:600; margin-left:2px; }
  .tab[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tab[aria-selected="true"] .count { color:#fff; }
  .hint { color:var(--muted); font-size:13px; margin:12px 0 8px; }
  .panel { margin-top: 4px; }
  .js .panel[hidden], .js .entry.off { display:none; }
  .entry { position:relative; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow-wrap:anywhere; }
  .entry summary { list-style:none; cursor:pointer; padding:12px 16px; display:grid; gap:2px; }
  .entry summary::-webkit-details-marker { display:none; }
  .entry summary::after { content:"▾"; position:absolute; right:16px; top:12px; color:var(--muted); }
  .entry[open] summary::after { content:"▴"; }
  .line1 { padding-right:20px; }
  .line1 b { font-size:15px; margin-right:6px; }
  .line2 { font-size:14px; }
  .line3 { font-size:12px; color:var(--muted); }
  .body { padding: 0 16px 16px; border-top:1px solid var(--line); }
  .meta { font-size:13px; margin:10px 0; }
  .meta a { color:var(--muted); }
  .empty { color:var(--muted); font-size:14px; padding: 12px 2px; }
  .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; margin-top:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); vertical-align: top; }
  th { color:var(--muted); font-weight:600; background:var(--card); white-space:nowrap; }
  tr:last-child td { border-bottom:none; }
  td a { color:var(--fg); }
  .none { color:var(--muted); }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .wait { color:var(--warn); }
  .evidence a { white-space:nowrap; }
  .cvss { color:var(--muted); font-size:12px; }
  .badge { display:inline-block; font-size:12px; font-weight:600; border-radius:999px; padding:0 10px; white-space:nowrap; border:1px solid var(--muted); color:var(--muted); vertical-align: 1px; }
  .badge.approved, .badge.v-fixed { color:var(--ok); border-color:var(--ok); }
  .badge.merged, .badge.v-published { color:var(--merged); border-color:var(--merged); }
  .badge.changes { color:var(--bad); border-color:var(--bad); }
  .badge.vuln { color:var(--bad); border-color:var(--bad); }
  .badge.rereview, .badge.ci_approval, .badge.v-triage, .badge.v-accepted { color:var(--warn); border-color:var(--warn); }
  dl { margin:0; display:grid; grid-template-columns: 120px 1fr; gap:8px 16px; font-size:15px; }
  dt { color:var(--muted); font-size:14px; }
  dd { margin:0; }
  code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--line); padding:1px 5px; border-radius:4px; }
  .tr { font-style: normal; font-size: 14px; }
  blockquote { margin:12px 0 0; padding:8px 14px; border-left:3px solid var(--accent); color:var(--muted); font-style: italic; }
  footer { margin-top:40px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); padding-top:14px; }
  a { color: var(--accent); }
  @media (max-width: 600px) { dl { grid-template-columns: 1fr; } dt { margin-top:6px; } header h1 { font-size: 24px; } }
</style>
</head>
<body>
<main>
  <header>
    <nav class="lang">{{switch}}</nav>
    <h1>{{name}}</h1>
    <p>{{tagline}}</p>
    <ul class="tags">{{tags}}</ul>
  </header>

  <div class="summary">{{summary}}</div>
  <div class="live" id="live">{{loading}}</div>

  <nav class="tabbar" role="tablist">{{tabs}}</nav>

  <section class="panel" id="panel-prs">
    <p class="hint">{{hint}}</p>
{{entries}}
    <p class="empty" id="empty" hidden>{{empty_tab}}</p>
  </section>

  <footer>{{footer}}</footer>
</main>
<script id="labels" type="application/json">{{labels}}</script>
<script>
(() => {
  const L = JSON.parse(document.getElementById("labels").textContent);
  const tabs = [...document.querySelectorAll(".tab")];
  const entries = () => [...document.querySelectorAll(".entry")];

  /* Show the entries of one tab; the CVE tab shows the report table instead. */
  function show(name) {
    if (!tabs.some((t) => t.dataset.tab === name && !t.hidden)) name = "all";
    for (const t of tabs) t.setAttribute("aria-selected", String(t.dataset.tab === name));
    let shown = 0;
    for (const e of entries()) {
      const on = name === "all" || e.dataset.group === name;
      e.classList.toggle("off", !on);
      if (on) shown++;
    }
    document.getElementById("empty").hidden = shown > 0;
  }
  function count() {
    const n = { done: 0, review: 0, ci: 0, closed: 0 };
    for (const e of entries()) n[e.dataset.group] = (n[e.dataset.group] || 0) + 1;
    for (const g of Object.keys(n)) {
      const c = document.getElementById("c-" + g);
      if (c) c.textContent = String(n[g]);
    }
    const closed = tabs.find((t) => t.dataset.tab === "closed");
    if (closed) closed.hidden = n.closed === 0;
  }
  const current = () => (location.hash.startsWith("#tab-") ? location.hash.slice(5) : "all");
  for (const t of tabs) t.addEventListener("click", () => {
    show(t.dataset.tab);
    try { history.replaceState(null, "", "#tab-" + t.dataset.tab); } catch (e) { /* file:// pages */ }
  });
  /* a link to one entry (#owner-repo-123) opens it in the All tab */
  const target = location.hash && !location.hash.startsWith("#tab-") ? document.getElementById(location.hash.slice(1)) : null;
  if (target && target.tagName === "DETAILS") { target.open = true; show("all"); } else show(current());

  /* Re-read merged, closed and approved pull requests from the GitHub search API on every load,
     so a refresh shows them without waiting for the next rebuild. Three unauthenticated
     search requests; on any failure the page keeps the snapshot it was built with. */
  const out = document.getElementById("live");
  const search = (q) =>
    fetch("https://api.github.com/search/issues?per_page=100&q=" + encodeURIComponent(q),
          { headers: { Accept: "application/vnd.github+json" } })
      .then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); });
  const base = "author:" + L.owner + " is:pr";
  Promise.all([base, base + " review:approved", base + " review:changes_requested"].map(search))
    .then(([all, approved, changes]) => {
      const id = (it) => it.repository_url.replace("https://api.github.com/repos/", "") + "#" + it.number;
      const ok = new Set(approved.items.map(id));
      const asked = new Set(changes.items.map(id));
      for (const it of all.items) {
        let stage = null;
        if (it.pull_request && it.pull_request.merged_at) stage = "merged";
        else if (it.state === "closed") stage = "closed";
        else if (ok.has(id(it)) && !asked.has(id(it))) stage = "approved";
        if (!stage) continue;
        for (const el of document.querySelectorAll('[data-pr="' + CSS.escape(id(it)) + '"]')) {
          el.className = "badge " + stage;
          el.textContent = L.stages[stage];
          const entry = el.closest(".entry");
          if (entry) entry.dataset.group = L.groups[stage];
        }
      }
      count();
      show(tabs.find((t) => t.getAttribute("aria-selected") === "true")?.dataset.tab || "all");
      const t = new Date().toLocaleString(document.documentElement.lang === "ko" ? "ko-KR" : "en-GB",
        { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      out.textContent = L.live.replace("{t}", t + " KST");
    })
    .catch(() => { out.textContent = L.snapshot; });
})();
</script>
</body>
</html>
