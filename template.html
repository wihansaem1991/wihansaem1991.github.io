<!doctype html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} — {{title_suffix}}</title>
<meta name="description" content="{{tagline}}">
<link rel="alternate" hreflang="en" href="https://wihansaem1991.github.io/">
<link rel="alternate" hreflang="ko" href="https://wihansaem1991.github.io/ko/">
<style>
  :root { --fg:#1d2433; --muted:#5b6475; --line:#e3e7ee; --accent:#1f6feb; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --bg:#ffffff; --card:#f7f9fc; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6e9ef; --muted:#9aa3b2; --line:#2a313c; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --bg:#0f1419; --card:#161b22; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 40px 20px 64px; }
  header { position: relative; }
  .lang { position:absolute; top:0; right:0; font-size:14px; }
  header h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; padding-right: 80px; }
  header p { margin: 0; color: var(--muted); font-size: 15px; }
  .tags { margin: 12px 0 0; display:flex; flex-wrap:wrap; gap:6px; padding:0; list-style:none; }
  .tags li { border:1px solid var(--line); border-radius:999px; padding:1px 10px; font-size:12px; color:var(--muted); }

  .wins { margin: 28px 0 8px; }
  .wins h2, .section h2 { font-size: 20px; margin: 0 0 4px; letter-spacing:-0.01em; }
  .wins-intro { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
  .hint { color:var(--muted); font-size:13px; margin:4px 0 12px; }
  .win-grid { display:grid; gap:12px; }
  .win { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--ok);
         border-radius:12px; padding:4px 16px 8px; overflow-wrap:anywhere; }
  .win-head { display:flex; align-items:baseline; gap:8px; padding:10px 0 2px; }
  .win-head a { text-decoration:none; }
  .win-head b { font-size:16px; color:var(--fg); }
  .win-count { margin-left:auto; color:var(--muted); font-size:12px; white-space:nowrap; }

  .section { margin-top: 32px; }

  .entry { position:relative; overflow-wrap:anywhere; }
  .entry summary { list-style:none; cursor:pointer; display:grid; gap:2px; }
  .entry summary::-webkit-details-marker { display:none; }
  .entry summary::after { content:"▾"; position:absolute; color:var(--muted); }
  .entry[open] summary::after { content:"▴"; }
  .win .entry { border-top:1px solid var(--line); }
  .win .entry summary { padding:10px 20px 10px 0; }
  .win .entry summary::after { right:0; top:10px; }
  .win .entry .body { padding:2px 0 12px; }
  .section .entry { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; }
  .section .entry summary { padding:12px 34px 12px 16px; }
  .section .entry summary::after { right:16px; top:12px; }
  .section .entry .body { padding:0 16px 16px; border-top:1px solid var(--line); }
  .line1 { padding-right:20px; }
  .line1 b { font-size:15px; margin-right:6px; }
  .line2 { font-size:15px; }
  .line3 { font-size:12px; color:var(--muted); }
  .body dl { margin-top:10px; }

  .none { color:var(--muted); }
  .evidence a { white-space:nowrap; }
  .cvss { color:var(--muted); font-size:12px; }
  .badge { display:inline-block; font-size:12px; font-weight:600; border-radius:999px; padding:0 10px; white-space:nowrap; border:1px solid var(--muted); color:var(--muted); vertical-align: 1px; }
  .badge.vuln { color:var(--bad); border-color:var(--bad); }
  dl { margin:0; display:grid; grid-template-columns: 120px 1fr; gap:8px 16px; font-size:15px; }
  dt { color:var(--muted); font-size:14px; }
  dd { margin:0; }
  code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--line); padding:1px 5px; border-radius:4px; }
  .tr { font-style: normal; font-size: 14px; }
  blockquote { margin:12px 0 0; padding:8px 14px; border-left:3px solid var(--accent); color:var(--muted); font-style: italic; }

  .repos { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:10px; }
  .repo { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px;
          display:grid; gap:4px; align-content:start; overflow-wrap:anywhere; }
  .repo .name b { font-size:15px; margin-right:6px; }
  .repo .name a { font-size:13px; color:var(--muted); }
  .repo .about { font-size:14px; }
  .repo .focus { font-size:13px; color:var(--muted); }
  .repo .prs { font-size:13px; color:var(--muted); margin-top:4px; }
  footer { margin-top:40px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); padding-top:14px; }
  a { color: var(--accent); }
  @media (max-width: 600px) { dl { grid-template-columns: 1fr; } dt { margin-top:6px; } header h1 { font-size: 24px; } }
</style>
</head>
<body>
<main>
  <header>
    <nav class="lang">{{switch}}</nav>
    <h1>{{name}}</h1>
    <p>{{tagline}}</p>
    <ul class="tags">{{tags}}</ul>
  </header>
{{wins}}
  <section class="section" id="repos">
    <h2>{{repos_title}}</h2>
    <p class="hint">{{repos_hint}}</p>
    <div class="repos">{{repos}}</div>
  </section>
{{vulns}}
  <footer>{{footer}}</footer>
</main>
<script>
(() => {
  /* open a contribution when the address points straight at it (#owner-repo-123) */
  function follow() {
    const el = location.hash ? document.getElementById(decodeURIComponent(location.hash.slice(1))) : null;
    if (el && el.tagName === "DETAILS") { el.open = true; el.scrollIntoView(); }
  }
  follow();
  window.addEventListener("hashchange", follow);
})();
</script>
</body>
</html>
