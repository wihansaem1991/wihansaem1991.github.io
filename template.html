<!doctype html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} — {{title_suffix}}</title>
<meta name="description" content="{{tagline}}">
<link rel="alternate" hreflang="en" href="https://wihansaem1991.github.io/">
<link rel="alternate" hreflang="ko" href="https://wihansaem1991.github.io/ko/">
<style>
  :root { --fg:#1d2433; --muted:#5b6475; --line:#e3e7ee; --accent:#1f6feb; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --bg:#ffffff; --card:#f7f9fc;
          --c-hardening:#2a78d6; --c-bugfix:#eb6834; --c-test:#1baf7a; --c-cleanup:#eda100; --c-docs:#e87ba4; --c-feature:#6250d6; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6e9ef; --muted:#9aa3b2; --line:#2a313c; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --bg:#0f1419; --card:#161b22;
            --c-hardening:#3987e5; --c-bugfix:#d95926; --c-test:#199e70; --c-cleanup:#c98500; --c-docs:#d55181; --c-feature:#9085e9; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 36px 20px 56px; }
  a { color: var(--accent); }

  header { position: relative; }
  .lang { position:absolute; top:0; right:0; font-size:14px; }
  header h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; padding-right: 80px; }
  header p { margin: 0; color: var(--muted); font-size: 15px; }
  .tags { margin: 10px 0 0; display:flex; flex-wrap:wrap; gap:6px; padding:0; list-style:none; }
  .tags li { border:1px solid var(--line); border-radius:999px; padding:1px 10px; font-size:12px; color:var(--muted); }

  /* overview */
  .stats { margin-top: 24px; }
  .kpis { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 10px; text-align:center; }
  .kpi-n { font-size:30px; font-weight:700; letter-spacing:-0.02em; line-height:1; }
  .kpi-l { margin-top:6px; font-size:12px; color:var(--muted); }
  @media (max-width:560px) { .kpis { grid-template-columns: repeat(2,1fr); } }

  .chart-h { font-size:13px; color:var(--muted); font-weight:600; margin:22px 0 8px; }

  /* bar chart by project — each bar opens into its contributions */
  .bars { display:grid; gap:5px; }
  .bar { border-radius:8px; }
  .bar > summary { list-style:none; cursor:pointer; display:grid; grid-template-columns: 128px 1fr 26px; align-items:center; gap:10px; padding:6px 4px; }
  .bar > summary::-webkit-details-marker { display:none; }
  .bar-name { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track { height:16px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar-fill { display:block; height:100%; background:var(--ok); border-radius:4px; }
  .bar-n { font-size:13px; font-weight:600; text-align:right; color:var(--muted); }
  .bar[open] > summary { background:var(--card); border-radius:8px 8px 0 0; }
  .bar-body { background:var(--card); border-radius:0 0 8px 8px; padding:2px 12px 6px; }

  /* type mix — one stacked bar + legend */
  .stack { display:flex; gap:2px; height:20px; border-radius:5px; overflow:hidden; margin-bottom:8px; background:var(--line); }
  .seg { display:block; height:100%; min-width:3px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--muted); }
  .lg { display:inline-flex; align-items:center; gap:5px; }
  .sw { width:10px; height:10px; border-radius:2px; display:inline-block; }

  .hint { color:var(--muted); font-size:13px; margin:12px 0 0; }

  /* folded detail: vulnerabilities, repositories */
  .fold { margin-top:14px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  .fold > summary { list-style:none; cursor:pointer; padding:12px 16px; font-size:15px; display:flex; align-items:center; gap:8px; }
  .fold > summary::-webkit-details-marker { display:none; }
  .fold > summary::after { content:"▾"; margin-left:auto; color:var(--muted); }
  .fold[open] > summary::after { content:"▴"; }
  .fold-n { color:var(--muted); font-size:13px; font-weight:400; }
  .fold-body { padding:0 16px 14px; }
  .fold-body .hint { margin:0 0 8px; }

  /* an expandable contribution / report (nested in a bar or a fold) */
  .entry { position:relative; overflow-wrap:anywhere; border-top:1px solid var(--line); }
  .entry summary { list-style:none; cursor:pointer; display:grid; gap:1px; padding:9px 22px 9px 0; }
  .entry summary::-webkit-details-marker { display:none; }
  .entry summary::after { content:"▾"; position:absolute; right:2px; top:9px; color:var(--muted); font-size:11px; }
  .entry[open] summary::after { content:"▴"; }
  .entry .line1 b { font-size:14px; margin-right:6px; }
  .entry .line2 { font-size:14px; }
  .entry .line3 { font-size:12px; color:var(--muted); }
  .entry .body { padding:2px 0 12px; }
  .body dl { margin-top:8px; }

  dl { margin:0; display:grid; grid-template-columns: 110px 1fr; gap:7px 14px; font-size:14px; }
  dt { color:var(--muted); font-size:13px; }
  dd { margin:0; }
  .evidence a { white-space:nowrap; }
  .none { color:var(--muted); }
  .cvss { color:var(--muted); font-size:12px; }
  .badge { display:inline-block; font-size:11px; font-weight:600; border-radius:999px; padding:0 9px; white-space:nowrap; border:1px solid var(--muted); color:var(--muted); vertical-align:1px; }
  .badge.vuln { color:var(--bad); border-color:var(--bad); }
  code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--line); padding:1px 5px; border-radius:4px; }
  .tr { font-style: normal; font-size: 13px; }
  blockquote { margin:10px 0 0; padding:7px 13px; border-left:3px solid var(--accent); color:var(--muted); font-style: italic; font-size:14px; }

  /* repository chips */
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:3px 11px; font-size:13px; text-decoration:none; color:var(--fg); background:var(--bg); }
  .chip:hover { border-color:var(--accent); }
  .chip-n { color:var(--muted); font-size:12px; }

  footer { margin-top:32px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); padding-top:14px; }
  @media (max-width: 600px) { dl { grid-template-columns: 1fr; } dt { margin-top:6px; } header h1 { font-size: 23px; } .bar > summary { grid-template-columns: 96px 1fr 24px; } }
</style>
</head>
<body>
<main>
  <header>
    <nav class="lang">{{switch}}</nav>
    <h1>{{name}}</h1>
    <p>{{tagline}}</p>
    <ul class="tags">{{tags}}</ul>
  </header>
{{stats}}
{{vulns}}
{{repos}}
  <footer>{{footer}}</footer>
</main>
<script>
(() => {
  /* a deep link (#id) opens the target and every <details> above it */
  function follow() {
    if (!location.hash) return;
    const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (!el) return;
    for (let n = el; n; n = n.parentElement) { if (n.tagName === "DETAILS") n.open = true; }
    el.scrollIntoView();
  }
  follow();
  window.addEventListener("hashchange", follow);
})();
</script>
</body>
</html>
