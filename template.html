<!doctype html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} — {{title_suffix}}</title>
<meta name="description" content="{{tagline}}">
<link rel="alternate" hreflang="en" href="https://wihansaem1991.github.io/">
<link rel="alternate" hreflang="ko" href="https://wihansaem1991.github.io/ko/">
<style>
  :root { --fg:#1d2433; --muted:#5b6475; --line:#e3e7ee; --accent:#1f6feb; --ok:#1a7f37; --merged:#8250df; --warn:#9a6700; --bad:#cf222e; --bg:#ffffff; --card:#f7f9fc; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6e9ef; --muted:#9aa3b2; --line:#2a313c; --accent:#58a6ff; --ok:#3fb950; --merged:#a371f7; --warn:#d29922; --bad:#f85149; --bg:#0f1419; --card:#161b22; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 56px 24px 72px; }
  header { position: relative; }
  .lang { position:absolute; top:0; right:0; font-size:14px; }
  header h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: -0.02em; padding-right: 80px; }
  header p { margin: 0; color: var(--muted); }
  .tags { margin: 16px 0 0; display:flex; flex-wrap:wrap; gap:8px; padding:0; list-style:none; }
  .tags li { border:1px solid var(--line); border-radius:999px; padding:2px 12px; font-size:13px; color:var(--muted); }
  h2 { margin: 48px 0 16px; font-size: 20px; }
  .stats { display:grid; grid-template-columns: repeat(5, 1fr); gap:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat b { display:block; font-size:28px; }
  .stat span { color:var(--muted); font-size:14px; }
  .live { margin-top:10px; color:var(--muted); font-size:13px; }
  .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); vertical-align: top; }
  th { color:var(--muted); font-weight:600; background:var(--card); white-space:nowrap; }
  td:nth-child(5), td:nth-child(6), td:nth-child(7) { white-space:nowrap; }
  tr:last-child td { border-bottom:none; }
  td a { color:var(--fg); }
  td a:hover { color:var(--accent); }
  .none { color:var(--muted); }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .wait { color:var(--warn); }
  .more { color:var(--muted); text-decoration:none; font-size:13px; }
  .evidence a { white-space:nowrap; }
  .cvss { color:var(--muted); font-size:12px; }
  article { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:16px; }
  article h3 { margin:0 0 4px; font-size:18px; }
  article h3 a { color:var(--fg); text-decoration:none; }
  article h3 a:hover { color:var(--accent); }
  .meta { color:var(--muted); font-size:14px; margin-bottom:12px; }
  .badge { display:inline-block; font-size:12px; font-weight:600; border-radius:999px; padding:0 10px; white-space:nowrap; border:1px solid var(--muted); color:var(--muted); }
  h3 .badge { margin-left:6px; vertical-align: 2px; }
  .badge.approved, .badge.v-fixed { color:var(--ok); border-color:var(--ok); }
  .badge.merged, .badge.v-published { color:var(--merged); border-color:var(--merged); }
  .badge.changes { color:var(--bad); border-color:var(--bad); }
  .badge.rereview, .badge.ci_approval, .badge.v-triage, .badge.v-accepted { color:var(--warn); border-color:var(--warn); }
  dl { margin:0; display:grid; grid-template-columns: 140px 1fr; gap:8px 16px; }
  dt { color:var(--muted); font-size:14px; }
  dd { margin:0; }
  code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--line); padding:1px 5px; border-radius:4px; }
  .tr { font-style: normal; font-size: 14px; }
  blockquote { margin:12px 0 0; padding:8px 14px; border-left:3px solid var(--accent); color:var(--muted); font-style: italic; }
  footer { margin-top:48px; color:var(--muted); font-size:13px; border-top:1px solid var(--line); padding-top:16px; }
  a { color: var(--accent); }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } dl { grid-template-columns: 1fr; } dt { margin-top:6px; } }
</style>
</head>
<body>
<main>
  <header>
    <nav class="lang">{{switch}}</nav>
    <h1>{{name}}</h1>
    <p>{{tagline}}</p>
    <ul class="tags">{{tags}}</ul>
  </header>

  <h2>{{glance}}</h2>
  <div class="stats">{{stats}}</div>
  <div class="live" id="live">{{loading}}</div>

  <h2>{{challenge}}</h2>
  <div class="table-wrap">
    <table>
      <thead><tr>{{head}}</tr></thead>
      <tbody>{{rows}}</tbody>
    </table>
  </div>

  <h2>{{cve}}</h2>
  <div class="table-wrap">
    <table>
      <thead><tr>{{cve_head}}</tr></thead>
      <tbody>{{cve_rows}}</tbody>
    </table>
  </div>

  <h2>{{details}}</h2>
{{cards}}

  <footer>{{footer}}</footer>
</main>
<script id="labels" type="application/json">{{labels}}</script>
<script>
/* Re-read merged, closed and approved pull requests from the GitHub search API on every load,
   so a refresh shows them without waiting for the hourly rebuild. Three unauthenticated
   search requests; on any failure the page keeps the snapshot it was built with. */
(async () => {
  const L = JSON.parse(document.getElementById("labels").textContent);
  const out = document.getElementById("live");
  const search = (q) =>
    fetch("https://api.github.com/search/issues?per_page=100&q=" + encodeURIComponent(q),
          { headers: { Accept: "application/vnd.github+json" } })
      .then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); });
  try {
    const base = "author:" + L.owner + " is:pr";
    const [all, approved, changes] = await Promise.all(
      [base, base + " review:approved", base + " review:changes_requested"].map(search));
    const id = (it) => it.repository_url.replace("https://api.github.com/repos/", "") + "#" + it.number;
    const ok = new Set(approved.items.map(id));
    const asked = new Set(changes.items.map(id));
    for (const it of all.items) {
      let stage = null;
      if (it.pull_request && it.pull_request.merged_at) stage = "merged";
      else if (it.state === "closed") stage = "closed";
      else if (ok.has(id(it)) && !asked.has(id(it))) stage = "approved";
      if (!stage) continue;
      for (const el of document.querySelectorAll('[data-pr="' + CSS.escape(id(it)) + '"]')) {
        el.className = "badge " + stage;
        el.textContent = L.stages[stage];
      }
    }
    const rows = document.querySelectorAll("tbody tr td .badge[data-pr]");
    const done = [...rows].filter((el) => L.done.some((s) => el.classList.contains(s))).length;
    document.getElementById("s-done").textContent = String(done);
    const t = new Date().toLocaleString(document.documentElement.lang === "ko" ? "ko-KR" : "en-GB",
      { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    out.textContent = L.live.replace("{t}", t + " KST");
  } catch (e) {
    out.textContent = L.snapshot;
  }
})();
</script>
</body>
</html>
