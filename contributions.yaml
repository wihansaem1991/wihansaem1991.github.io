      ko: >-
        0에서 멈추지 않고 여덟 그룹을 모두 돌게 했습니다. 불일치가 1,524건에서 0건이 됐고 기존 시험의 문자열은 그대로입니다.

  - project: RustCrypto
    repo: RustCrypto/crypto-bigint
    pr: 1382
    title:
      en: "BoxedUint: parse \"0\" as a one-limb zero"
      ko: "BoxedUint: \"0\"을 limb 1개짜리 0으로 읽기"
    type: bugfix
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-01
    decided: null
    defect:
      en: >-
        Parsing the string `"0"` produced a big integer with no limbs at all. It printed as an empty
        string and panicked in `bits_vartime()`.
      ko: >-
        문자열 `"0"`을 읽으면 limb가 하나도 없는 큰 정수가 만들어졌습니다. 출력하면 빈 문자열이 나오고
        `bits_vartime()`에서 패닉했습니다.
    background:
      en: >-
        Arbitrary-precision integer representation in a constant-time cryptography library: every
        value, including zero, is expected to have at least one limb.
      ko: >-
        상수 시간 암호 라이브러리의 다정밀 정수 표현에서는 0을 포함한 모든 값이 limb를 최소 하나 가져야 합니다.
    found_by:
      en: >-
        Differential fuzzing of the big-integer API against `num-bigint`.
      ko: >-
        큰 정수 API를 `num-bigint`와 비교하는 차등 퍼징으로 찾았습니다.
    fix:
      en: >-
        Return the canonical one-limb zero when no digits remain; a new test covers several spellings
        of zero in four radixes and panics without the fix.
      ko: >-
        숫자가 남지 않으면 limb 1개짜리 표준 0을 돌려주게 했습니다. 새 시험은 네 가지 진법에서 0의 여러
        표기를 확인하고, 수정을 빼면 패닉합니다.

  - project: Botan
    repo: randombit/botan
    pr: 6082
    title:
      en: Reject Classic McEliece private keys of the wrong length with Invalid_Argument
      ko: 길이가 틀린 Classic McEliece 비밀키를 Invalid_Argument로 거부
    type: bugfix
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-01
    decided: null
    defect:
      en: >-
        A Classic McEliece private key of the wrong length, given directly or inside PKCS#8, hit an
        internal assertion and raised `Internal_Error`, while the public key path rejected the same
        mistake as an invalid argument.
      ko: >-
        길이가 틀린 Classic McEliece 비밀키를 직접 넘기거나 PKCS#8 안에 넣으면 내부 단언에 걸려
        `Internal_Error`가 났습니다. 공개키 쪽은 같은 실수를 잘못된 인자로 거부했습니다.
    background:
      en: >-
        Classic McEliece (NIST PQC round 4 KEM) key encodings have fixed sizes per parameter set; a
        library should report malformed keys as input errors, not as internal failures callers
        do not expect to catch.
      ko: >-
        Classic McEliece(NIST PQC 4라운드 KEM)의 키 인코딩은 매개변수마다 크기가 정해져 있습니다. 라이브러리는
        잘못된 키를 입력 오류로 알려야 하고, 호출자가 잡을 생각을 하지 않는 내부 오류로 내면 안 됩니다.
    found_by:
      en: >-
        Length and mutation sweeps over Botan's PQC key decoders (16 million inputs, no memory errors)
        flagged this as the one inconsistent rejection.
      ko: >-
        Botan 양자내성 키 디코더에 길이·변형 입력 1,600만 건을 넣은 측정(메모리 오류 0건)에서 유일하게
        거부 방식이 어긋난 곳으로 나왔습니다.
    fix:
      en: >-
        Check the length in the private key constructor exactly like the public key constructor; a
        new test fails without the check.
      ko: >-
        비밀키 생성자에서도 공개키 생성자와 똑같이 길이를 검사합니다. 새 시험은 검사를 빼면 실패합니다.

  - project: liboqs
    repo: open-quantum-safe/liboqs
    pr: 2665
    title:
      en: Let ML-DSA Wycheproof verify vectors reach the library with wrong lengths
      ko: 잘못된 길이의 ML-DSA Wycheproof 검증 벡터가 라이브러리까지 가도록
    type: test
    cve: null
    cvss: null
    status: open
    submitted: 2026-10-31
    decided: null
    defect:
      en: >-
        liboqs's test harness rejected ML-DSA signatures of the wrong length, and contexts longer than
        255 bytes, before calling the library, and the runner counted that as a pass. The Wycheproof
        `IncorrectSignatureLength` and `InvalidContext` vectors never reached liboqs: disabling the
        signature-length check in liboqs's ML-DSA glue code left every test passing.
      ko: >-
        liboqs 시험 하네스가 길이가 틀린 ML-DSA 서명과 255바이트를 넘는 context를 라이브러리 호출 전에 걸렀고,
        실행기는 이를 통과로 셌습니다. 그래서 Wycheproof `IncorrectSignatureLength`·`InvalidContext` 벡터가
        liboqs에 닿지 않았고, liboqs ML-DSA 연결 코드의 서명 길이 검사를 꺼도 시험이 전부 통과했습니다.
    background:
      en: >-
        FIPS 204 fixes the ML-DSA signature length for each parameter set. liboqs wraps the mldsa-native
        implementation in its own glue code, and that glue is what has to enforce the length at the
        public API.
      ko: >-
        FIPS 204는 ML-DSA 매개변수 집합마다 서명 길이를 고정합니다. liboqs는 mldsa-native 구현을 자체 연결
        코드로 감싸므로, 공개 API에서 이 길이를 지키는 책임이 그 연결 코드에 있습니다.
    found_by:
      en: >-
        A sweep of the Wycheproof test harnesses of nine cryptography libraries for vectors that are
        skipped, followed by mutation testing on liboqs.
      ko: >-
        암호 라이브러리 9곳의 Wycheproof 시험 하네스에서 건너뛰는 벡터를 훑은 뒤, liboqs에서 변이 시험으로
        확인했습니다.
    fix:
      en: >-
        For ML-DSA, reject only malformed hex input, as the neighbouring SLH-DSA branch already does,
        so the vectors exercise the library's own checks. Disabling the glue check now fails the
        Wycheproof tests for all three parameter sets.
      ko: >-
        ML-DSA도 바로 옆 SLH-DSA 분기처럼 잘못된 hex 입력만 거르고 나머지는 라이브러리로 넘깁니다. 이제 연결
        코드의 길이 검사를 끄면 세 매개변수 집합 모두 Wycheproof 시험이 실패합니다.

  - project: pkcs11-provider
    repo: openssl-projects/pkcs11-provider
    pr: 814
    title:
      en: Cancel the signing operation after CKR_BUFFER_TOO_SMALL
      ko: CKR_BUFFER_TOO_SMALL 뒤 서명 작업 취소
    type: bugfix
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-01
    decided: null
    defect:
      en: >-
        One signature into a buffer that was too small left the signing operation active on a pooled
        PKCS#11 session. Every later signature that picked up that session failed with
        `CKR_OPERATION_ACTIVE`: with NSS softokn, one 255-byte buffer for a 2048-bit RSA key broke all
        RSA, RSA-PSS, ECDSA and DigestSign signatures for the rest of the process.
      ko: >-
        너무 작은 버퍼로 서명을 한 번 하면 풀에 있는 PKCS#11 세션에 서명 작업이 열린 채 남았습니다. 그 세션을
        받은 다음 서명은 모두 `CKR_OPERATION_ACTIVE`로 실패했습니다. NSS softokn에서 2048비트 RSA 키로
        255바이트 버퍼에 한 번 서명하자, 그 프로세스의 RSA·RSA-PSS·ECDSA·DigestSign 서명이 전부 멈췄습니다.
    background:
      en: >-
        PKCS#11 session semantics: `C_Sign()` returning `CKR_BUFFER_TOO_SMALL` keeps the operation
        active so the caller can retry with a larger buffer, so a provider that pools sessions has to
        end the operation before handing the session back.
      ko: >-
        PKCS#11 세션 규약 지식이 필요했습니다. `C_Sign()`이 `CKR_BUFFER_TOO_SMALL`을 돌려주면 더 큰 버퍼로 다시
        부를 수 있게 작업을 열어 둡니다. 세션을 풀로 돌려쓰는 provider는 돌려주기 전에 그 작업을 끝내야 합니다.
    found_by:
      en: >-
        A buffer-size sweep: every signature, derivation and decryption path of pkcs11-provider was run
        with buffers smaller and larger than needed, then followed by a normal call to see whether the
        session was still usable.
      ko: >-
        버퍼 크기 측정으로 찾았습니다. pkcs11-provider의 서명·파생·복호화 경로마다 필요한 것보다 작고 큰 버퍼를
        넣은 뒤, 이어서 정상 호출을 해 세션이 아직 쓸 수 있는지 봤습니다.
    fix:
      en: >-
        Move the existing cleanup for a hanging operation into a helper and call it on
        `CKR_BUFFER_TOO_SMALL` before the session is returned. The new `sigbuf` test fails without
        the change and passes with it.
      ko: >-
        열린 작업을 정리하던 기존 코드를 함수로 빼서, `CKR_BUFFER_TOO_SMALL`이면 세션을 돌려주기 전에 부릅니다.
        새 `sigbuf` 시험은 수정 전에 실패하고 수정 후에 통과합니다.

  - project: pkcs11-provider
    repo: openssl-projects/pkcs11-provider
    pr: 815
    title:
      en: Check raw RSA sign data against the modulus, not the buffer size
      ko: RSA 무패딩 서명 입력을 버퍼 크기가 아니라 모듈러스와 비교
    type: bugfix
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-01
    decided: null
    defect:
      en: >-
        Raw RSA signing (`RSA_NO_PADDING`) on a token key failed whenever the output buffer was larger
        than the modulus, although the input was correct; the default provider signs the same input
        into the same buffer and returns the modulus size.
      ko: >-
        토큰 키로 RSA 무패딩(`RSA_NO_PADDING`) 서명을 하면, 입력이 맞아도 출력 버퍼가 모듈러스보다 크기만 하면
        실패했습니다. 기본 provider는 같은 입력·같은 버퍼로 서명하고 모듈러스 크기를 돌려줍니다.
    background:
      en: >-
        RSA and OpenSSL provider API: `EVP_PKEY_sign()` takes the buffer size in `*siglen`, and raw RSA
        requires the input to be exactly as long as the modulus (`CKM_RSA_X_509` in PKCS#11).
      ko: >-
        RSA와 OpenSSL provider API 지식이 필요했습니다. `EVP_PKEY_sign()`은 `*siglen`으로 버퍼 크기를 받고,
        무패딩 RSA(PKCS#11의 `CKM_RSA_X_509`)는 입력이 모듈러스와 정확히 같은 길이여야 합니다.
    found_by:
      en: >-
        The same buffer-size sweep, comparing pkcs11-provider with OpenSSL's default provider: buffers
        of 257, 512 and 8448 bytes failed on the token and succeeded on the default provider.
      ko: >-
        같은 버퍼 크기 측정에서 pkcs11-provider와 OpenSSL 기본 provider를 비교해 찾았습니다. 257·512·8448바이트
        버퍼가 토큰에서는 실패하고 기본 provider에서는 성공했습니다.
    fix:
      en: >-
        Compare the input length with the key's modulus size instead of the caller's buffer size. The
        new `rsaraw` test checks both providers, recovers the data from the token signature, and still
        refuses input shorter than the modulus.
      ko: >-
        입력 길이를 호출자 버퍼 크기가 아니라 키의 모듈러스 크기와 비교합니다. 새 `rsaraw` 시험은 두 provider를
        모두 확인하고, 토큰 서명에서 원래 데이터를 되살려 보며, 모듈러스보다 짧은 입력은 여전히 거부하는지 봅니다.

  - project: TF-PSA-Crypto
    repo: Mbed-TLS/TF-PSA-Crypto
    pr: 960
    title:
      en: Zeroize the temporary buffer in mbedtls_mpi_gcd_modinv_odd()
      ko: mbedtls_mpi_gcd_modinv_odd() 임시 버퍼 소거
    type: hardening
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-01
    decided: null
    defect:
      en: >-
        The modular inverse routine freed its work buffer without clearing it. After
        `mbedtls_mpi_inv_mod()` the inverse stayed in freed heap memory, and after 2048-bit RSA key
        generation the private CRT coefficient QP did.
      ko: >-
        모듈러 역원 함수가 작업 버퍼를 지우지 않고 해제했습니다. `mbedtls_mpi_inv_mod()` 뒤에는 역원이,
        2048비트 RSA 키 생성 뒤에는 개인키의 CRT 계수 QP가 해제된 힙 메모리에 남았습니다.
    background:
      en: >-
        Cryptographic module validation: critical security parameters must be zeroized when no longer
        needed (ISO/IEC 19790 and its Korean counterpart used in KCMVP), and RSA-CRT private keys
        include QP = q^-1 mod p.
      ko: >-
        암호모듈 검증 지식을 썼습니다. 핵심 보안 매개변수는 더 쓰지 않으면 소거해야 하고(ISO/IEC 19790, KCMVP가
        쓰는 국내 규격), RSA-CRT 개인키에는 QP = q^-1 mod p가 들어 있습니다.
    found_by:
      en: >-
        Measurement on aarch64 Linux: `free()` was intercepted and every freed block searched for the
        known values, with a control build that disables zeroization to prove the harness finds them.
      ko: >-
        aarch64 리눅스에서 측정으로 찾았습니다. `free()`를 가로채 해제되는 블록마다 알려진 값을 찾았고, 소거를
        끈 대조 빌드로 측정이 실제로 잡는지 먼저 확인했습니다.
    fix:
      en: >-
        Release the buffer with `mbedtls_mpi_zeroize_and_free()`, as the modular exponentiation code
        already does. Both measurements drop to 0; the `bignum` and `rsa` test suites pass.
      ko: >-
        모듈러 거듭제곱 코드처럼 `mbedtls_mpi_zeroize_and_free()`로 해제합니다. 두 측정값이 모두 0이 됐고,
        `bignum`·`rsa` 시험 묶음도 통과합니다.

  - project: tpm2-tss
    repo: tpm2-software/tpm2-tss
    pr: 3198
    title:
      en: "mu: Accept a NULL offset in the TPMS_EMPTY marshalling functions"
      ko: "mu: TPMS_EMPTY 마샬링 함수가 NULL offset을 받게 고침"
    type: bugfix
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-01
    decided: null
    defect:
      en: >-
        `Tss2_MU_TPMS_EMPTY_Marshal()` and `Tss2_MU_TPMS_EMPTY_Unmarshal()` read `*offset` for a
        debug log line without checking it. Every other function in the file accepts a NULL offset;
        these two read through a NULL pointer.
      ko: >-
        `Tss2_MU_TPMS_EMPTY_Marshal()`·`Tss2_MU_TPMS_EMPTY_Unmarshal()`가 디버그 로그를 찍으려고 `*offset`을
        확인 없이 읽었습니다. 같은 파일의 다른 함수는 모두 NULL offset을 받는데, 이 둘은 널 포인터를
        읽었습니다.
    background:
      en: >-
        tpm2-tss builds its marshalling (MU) functions from C macros, and each macro logs
        `offset ? *offset : 0xffff`. At the default log level `LOG_DEBUG()` is a plain function call,
        so its arguments are evaluated even when debug logging is off.
      ko: >-
        tpm2-tss는 마샬링(MU) 함수를 C 매크로로 찍어 내고, 매크로마다 로그에 `offset ? *offset : 0xffff`를
        씁니다. 기본 로그 수준에서 `LOG_DEBUG()`는 그냥 함수 호출이라 디버그 로그가 꺼져 있어도 인자를
        계산합니다.
    found_by:
      en: >-
        Calling the MU functions with a NULL offset under UndefinedBehaviorSanitizer.
      ko: >-
        MU 함수에 NULL offset을 넘겨 UndefinedBehaviorSanitizer로 돌려 찾았습니다.
    fix:
      en: >-
        `TPMS_MARSHAL_0` and `TPMS_UNMARSHAL_0` log `offset ? *offset : 0xffff` like the other
        macros. A new unit test stops with the UBSan report when the fix is reverted;
        `TPMS-marshal` passes 12/12.
      ko: >-
        `TPMS_MARSHAL_0`·`TPMS_UNMARSHAL_0`도 다른 매크로처럼 `offset ? *offset : 0xffff`를 씁니다. 수정을
        되돌리면 새 단위 시험이 UBSan 보고로 멈추고, 고친 뒤 `TPMS-marshal` 시험 12개가 모두 통과합니다.

  - project: RustCrypto
    repo: RustCrypto/crypto-bigint
    pr: 1383
    title:
      en: "BoxedUint: document that from_*e_slice drops bits above the precision"
      ko: "BoxedUint: from_*e_slice가 정밀도 위 비트를 버린다고 문서 고침"
    type: docs
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-01
    decided: null
    defect:
      en: >-
        The docs of `BoxedUint::from_be_slice` and `from_le_slice` promised
        `DecodeError::Precision` for a value wider than `bits_precision`. Since #1266 both functions
        mask those bits off and return `Ok`, and that PR changed the test to expect it.
      ko: >-
        `BoxedUint::from_be_slice`·`from_le_slice` 문서는 값이 `bits_precision`보다 넓으면
        `DecodeError::Precision`을 돌려준다고 적었습니다. #1266 뒤로 두 함수는 그 비트를 지우고 `Ok`를
        돌려주고, 그 PR이 시험도 그렇게 바꿨습니다.
    background:
      en: >-
        A fixed-precision integer type has to say what happens to input wider than its precision:
        reject it or truncate it, as RFC 6979 `bits2int` does. Callers decoding secret values rely
        on that answer.
      ko: >-
        고정 정밀도 정수 타입은 정밀도보다 넓은 입력을 거부할지, RFC 6979 `bits2int`처럼 잘라 받을지 밝혀야
        합니다. 비밀값을 읽는 호출자가 그 약속에 기댑니다.
    found_by:
      en: >-
        Comparing each documented error with the code path, then tracing the change back to #1266
        with `git log -S`.
      ko: >-
        문서에 적힌 오류마다 실제 코드 경로와 맞춰 보고, `git log -S`로 어긋난 시점을 #1266까지 거슬러
        찾았습니다.
    fix:
      en: >-
        Describe the truncation and list only `DecodeError::InputSize`. The PR offers to restore the
        old error instead if the maintainers prefer it.
      ko: >-
        잘라 받는 동작을 적고 오류는 `DecodeError::InputSize`만 남겼습니다. 메인테이너가 옛 오류를 되살리기를
        원하면 그쪽으로 바꾸겠다고 PR에 적었습니다.

  - project: RustCrypto
    repo: RustCrypto/formats
    pr: 2501
    title:
      en: "der: reject malformed binary REAL values instead of panicking"
      ko: "der: 잘못된 이진 REAL 값을 패닉 대신 오류로 거부"
    type: bugfix
    cve: null
    cvss: null
    status: merged
    submitted: 2026-11-01
    decided: 2026-11-01
    defect:
      en: >-
        After #2483 fixed truncated content, the `der` crate's ASN.1 REAL (`f64`) decoder still
        panicked on a mantissa longer than eight octets, and on a zero mantissa or an out-of-range
        exponent in debug builds. In release builds the last two decoded to NaN and to an unrelated
        value (exponent 0x7fff gave 0.5).
      ko: >-
        #2483이 잘린 내용을 고친 뒤에도 `der` 크레이트의 ASN.1 REAL(`f64`) 해석기는 가수가 8옥텟을 넘으면
        패닉했고, 가수가 0이거나 지수가 범위를 벗어나면 디버그 빌드에서 패닉했습니다. 릴리스 빌드에서는 뒤의
        둘이 NaN과 엉뚱한 값(지수 0x7fff → 0.5)이 됐습니다.
    background:
      en: >-
        X.690 binary REAL encoding: sign, base, scaling factor F, exponent octets, then mantissa
        octets; zero has no contents octets (8.5.2). An IEEE-754 double needs the exponent within
        -1023..=1023 for this decoder's mapping.
      ko: >-
        X.690 이진 REAL 인코딩(부호·밑수·배율 F·지수 옥텟·가수 옥텟)을 썼습니다. 0은 내용 옥텟이 없어야
        하고(8.5.2), 이 해석기가 IEEE-754 double로 옮기려면 지수가 -1023..=1023 안에 있어야 합니다.
    found_by:
      en: >-
        Reading the decoder after #2483 for the remaining unchecked arithmetic, then reproducing
        each input on master and on `der` 0.8.3 in debug and release builds.
      ko: >-
        #2483 뒤의 해석기 코드에서 검사 없이 남은 산술을 찾고, 입력마다 master와 `der` 0.8.3에서 디버그·릴리스
        빌드로 재현했습니다.
    fix:
      en: >-
        Return a value error for each case. A new test covers the inputs and fails when any one of
        the three checks is removed; `der` tests pass (120).
      ko: >-
        세 경우 모두 값 오류를 돌려줍니다. 새 시험이 그 입력들을 다루고, 검사 셋 중 하나만 빼도 실패합니다.
        `der` 시험 120개가 통과합니다.

  - project: OpenSC
    repo: OpenSC/OpenSC
    pr: 3917
    title:
      en: "pkcs11: Encrypt with RSA public keys in software"
      ko: "pkcs11: RSA 공개키 암호화를 소프트웨어로 지원"
    type: bugfix
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-01
    decided: null
    defect:
      en: >-
        OpenSC's PKCS#11 module could verify signatures with a public key but not encrypt with one:
        `C_EncryptInit()` on an RSA public key failed with `CKR_KEY_TYPE_INCONSISTENT` (#3144). The
        p11test suite also never called `C_Encrypt()`, because its group setup dropped the flag
        that enables it.
      ko: >-
        OpenSC PKCS#11 모듈은 공개키로 서명 검증은 했지만 암호화는 못 했습니다. RSA 공개키로
        `C_EncryptInit()`을 부르면 `CKR_KEY_TYPE_INCONSISTENT`로 실패했습니다(#3144). 시험 도구 p11test도 그
        기능을 켜는 값을 시험 준비 단계에서 빠뜨려 `C_Encrypt()`를 한 번도 부르지 않았습니다.
    background:
      en: >-
        PKCS#11 object operations and mechanism flags (`CKF_ENCRYPT`), RSA PKCS#1 v1.5 and raw RSA
        encryption, and OpenSC's existing software path for `C_Verify()` through OpenSSL.
      ko: >-
        PKCS#11 객체 연산과 메커니즘 표시(`CKF_ENCRYPT`), RSA PKCS#1 v1.5·패딩 없는 RSA 암호화, 그리고 OpenSC가
        `C_Verify()`를 OpenSSL로 처리하는 기존 소프트웨어 경로를 썼습니다.
    found_by:
      en: >-
        A maintainer-labelled good first issue. A virtual SmartCard-HSM (pico-hsm emulation behind
        vsmartcard and a user-mode pcscd) reproduced it, and pkcs11-spy showed p11test never
        reaching `C_Encrypt()`.
      ko: >-
        메인테이너가 입문 과제로 표시한 이슈입니다. 가상 SmartCard-HSM(pico-hsm 에뮬레이션 + vsmartcard +
        사용자 모드 pcscd)으로 재현했고, pkcs11-spy로 p11test가 `C_Encrypt()`까지 가지 않는 것을 찾았습니다.
    fix:
      en: >-
        Public key objects encrypt with `CKM_RSA_PKCS` and `CKM_RSA_X_509` through OpenSSL, and p11test
        now keeps the flag. Card round trips work for both mechanisms; the CI p11test run matches
        the updated reference with no differences.
      ko: >-
        공개키 객체가 OpenSSL로 `CKM_RSA_PKCS`·`CKM_RSA_X_509` 암호화를 하고, p11test가 그 값을 넘기게
        고쳤습니다. 두 메커니즘 모두 카드 왕복이 맞고, CI 방식 p11test 결과가 고친 기준 파일과 차이 없이
        같습니다.

# Repositories being audited now, shown in the "Repositories" tab in this order. about: what the
# project is; focus: what I look at there. The pull request counts per stage come from `entries`.
# A repository whose changes are not GitHub pull requests gives `link` and `status` instead.
# Never list a repository that only has a private vulnerability report: that would name it.
repos:
  - project: OpenSSL
    repo: openssl/openssl
    about:
      en: The most widely deployed TLS and cryptography library, in C
