# Contribution and CVE challenge board. build.py renders every entry, once in English
# (index.html) and once in Korean (ko/index.html); the stage of each pull request comes from
# github.json, which sync.py refreshes (every hour in GitHub Actions).
# type: hardening | bugfix | test | vulnerability   (vulnerability entries carry a CVE id once assigned)
# Each entry is a briefing: defect (the problem), background (the knowledge it took),
# found_by, fix, review. Text fields are {en, ko} and accept `code` spans.
# Reviewer quotes stay in the original language; quote_ko is a marked translation.

owner:
  name: Hansaem Wi
  tagline:
    en: >-
      Security fixes and vulnerability reports for open-source cryptography, found by measurement
      and verified by tests, tracked here from submission to merge or CVE.
    ko: >-
      오픈소스 암호 라이브러리의 보안 결함을 측정으로 찾고 시험으로 검증해 고칩니다. 제출부터 머지·CVE까지
      진행 상황을 여기서 공개합니다.
  areas:
    en: [Post-quantum cryptography, KCMVP module validation, VPN, HSM / PKCS#11, AI systems]
    ko: [양자내성암호(PQC), KCMVP 암호모듈 검증, VPN, HSM / PKCS#11, AI 시스템]
  github: wihansaem1991

entries:
  - project: OpenSSL
    repo: openssl/openssl
    pr: 33444
    title:
      en: Clear the PBKDF1 derived key in `kdf_pbkdf1_derive_skey()`
      ko: "`kdf_pbkdf1_derive_skey()`에서 PBKDF1 파생 키를 지우고 해제"
    type: hardening
    cve: null
    cvss: null
    status: approved
    submitted: 2026-10-29
    decided: 2026-10-30
    branches: [master, "3.6", "4.0", "4.1"]
    defect:
      en: >-
        The derived key was imported as an `EVP_SKEY` and its temporary buffer freed with
        `OPENSSL_free()`, leaving the whole key in released heap memory.
      ko: >-
        파생 키를 `EVP_SKEY`로 가져온 뒤 임시 버퍼를 `OPENSSL_free()`로 해제해서, 키 전체가 해제된 힙
        메모리에 그대로 남았습니다.
    background:
      en: >-
        Key zeroisation as required by ISO/IEC 19790, the standard behind FIPS 140-3 and Korea's
        KCMVP validation: a derived key is secret material and has to be cleared before its memory
        is released. OpenSSL provides `OPENSSL_clear_free()` for exactly this.
      ko: >-
        FIPS 140-3와 KCMVP 검증의 바탕인 ISO/IEC 19790은 다 쓴 키를 지우도록(제로화) 요구합니다. 파생 키도
        비밀값이라 메모리를 돌려주기 전에 지워야 하고, OpenSSL은 이를 위해 `OPENSSL_clear_free()`를 둡니다.
    found_by:
      en: >-
        A measurement program that replaces OpenSSL's allocator and scans every freed block for
        key bytes: a 20-byte block holding the full key, freed at `pbkdf1.c:318`.
      ko: >-
        OpenSSL 할당자를 바꿔 해제되는 블록마다 키 바이트가 남았는지 재는 측정 프로그램으로 찾았습니다.
        `pbkdf1.c:318`에서 해제되는 20바이트 블록에 키 전체가 들어 있었습니다.
    fix:
      en: >-
        `OPENSSL_clear_free()` on both paths; `test_kdf_pbkdf1_skey` now watches freed blocks and
        fails if the change is reverted.
      ko: >-
        두 경로 모두 `OPENSSL_clear_free()`로 바꿨습니다. 기존 시험 `test_kdf_pbkdf1_skey`가 이제 해제
        블록을 감시하고, 수정을 되돌리면 실패합니다.
    review:
      en: Approved by two reviewers; triaged as a bug with FIPS relevance.
      ko: 리뷰어 두 명이 승인했고, FIPS와 관련된 버그로 분류됐습니다.
    quote: >-
      this is quite neat technique, I wonder if it should be generalised and used with other part
      of the code [that] pass around key material.
    quote_ko: >-
      꽤 깔끔한 기법이다. 키를 주고받는 다른 코드에도 일반화해서 쓰면 좋겠다.

  - project: OpenSSL
    repo: openssl/openssl
    pr: 33426
    title:
      en: Clear type-specific private key DER before freeing it
      ko: 키 형식별(type-specific) 개인키 DER를 지운 뒤 해제
    type: hardening
    cve: null
    cvss: null
    status: open
    submitted: 2026-10-28
    decided: null
    defect:
      en: >-
        `key_to_type_specific_der_bio()` freed the DER produced by the key's i2d function with
        `OPENSSL_free()`. For a private key that buffer holds the whole key, so every
        `i2d_PrivateKey()` or "type-specific" DER encoding of an RSA, EC, DSA or SM2 key left it in
        freed memory. The PEM path already cleared its copy.
      ko: >-
        `key_to_type_specific_der_bio()`가 키의 i2d 함수가 만든 DER를 `OPENSSL_free()`로 해제했습니다. 개인키라면
        이 버퍼에 키 전체가 들어 있어서, RSA·EC·DSA·SM2 키를 `i2d_PrivateKey()`나 "type-specific" DER로
        인코딩할 때마다 키가 해제된 메모리에 남았습니다. PEM 경로는 이미 사본을 지우고 있었습니다.
    background:
      en: >-
        The zeroisation rule of ISO/IEC 19790 (FIPS 140-3, KCMVP) and how OpenSSL 3 encoders hand key
        material between `i2d` functions and BIOs.
      ko: >-
        ISO/IEC 19790(FIPS 140-3·KCMVP)의 제로화 요건과, OpenSSL 3 인코더가 `i2d` 함수와 BIO 사이에서 키를
        넘기는 방식을 바탕으로 봤습니다.
    found_by:
      en: >-
        The freed-block measurement program, which swaps OpenSSL's allocator and looks for key bytes in
        every freed block, run over the key encoders.
      ko: >-
        OpenSSL 할당자를 바꿔 해제 블록마다 키 바이트를 찾는 측정 프로그램을 키 인코더에 돌려 찾았습니다.
    fix:
      en: >-
        `OPENSSL_clear_free()` for the encoded buffer. `test_type_specific_der_cleanse` encodes an RSA
        key both ways under a watching allocator and fails without the fix.
      ko: >-
        인코딩 버퍼를 `OPENSSL_clear_free()`로 해제합니다. 새 시험 `test_type_specific_der_cleanse`는 감시
        할당자를 건 채 RSA 키를 두 방식으로 인코딩하고, 수정이 없으면 실패합니다.

  - project: OpenSSL
    repo: openssl/openssl
    pr: 33430
    title:
      en: Clear the `EVP_ENCODE_CTX` when freeing it
      ko: "`EVP_ENCODE_CTX`를 해제할 때 지우기"
    type: hardening
    cve: null
    cvss: null
    status: open
    submitted: 2026-10-28
    decided: null
    defect:
      en: >-
        The base64 context keeps the last partial line of its input and was freed without clearing
        it. `PEM_write_bio()` encodes private key DER through such a context, so the last
        (length mod 48) bytes of the key stayed in freed memory: the end of `iqmp` for RSA, private
        key bytes for Ed448, ML-DSA and ML-KEM. Reading PEM left base64 text the same way.
      ko: >-
        base64 문맥은 입력의 마지막 부분 줄을 들고 있는데, 지우지 않고 해제했습니다. `PEM_write_bio()`는 개인키
        DER를 이 문맥으로 인코딩하므로 키의 마지막 (길이 mod 48)바이트가 해제된 메모리에 남았습니다. RSA라면
        `iqmp` 끝부분, Ed448·ML-DSA·ML-KEM이라면 개인키 바이트입니다. PEM을 읽을 때도 base64 문자열이 같은
        식으로 남았습니다.
    background:
      en: >-
        Zeroisation (ISO/IEC 19790, FIPS 140-3, KCMVP) followed through the PEM and base64 layers:
        `EVP_ENCODE_CTX` has been opaque since OpenSSL 1.1.0 and is always allocated by
        `EVP_ENCODE_CTX_new()`, so clearing it on free covers PEM reading, PEM writing and
        `BIO_f_base64`.
      ko: >-
        제로화 요건(ISO/IEC 19790, FIPS 140-3·KCMVP)을 PEM·base64 계층까지 따라갔습니다. `EVP_ENCODE_CTX`는
        OpenSSL 1.1.0부터 불투명 구조체라 항상 `EVP_ENCODE_CTX_new()`로 만들어지므로, 해제할 때 지우면 PEM
        읽기·쓰기와 `BIO_f_base64`가 모두 해결됩니다.
    found_by:
      en: >-
        The same freed-block measurement program, run over PEM encoding of private keys.
      ko: >-
        같은 해제 블록 측정 프로그램을 개인키 PEM 인코딩에 돌려 찾았습니다.
    fix:
      en: >-
        Clear the context in `EVP_ENCODE_CTX_free()`. `test_encode_ctx_free_clears_input` leaves a
        partial block in a context, swaps the free function and fails if the freed context still
        holds the input.
      ko: >-
        `EVP_ENCODE_CTX_free()`에서 문맥을 지웁니다. 새 시험 `test_encode_ctx_free_clears_input`은 문맥에 부분
        블록을 남긴 채 해제 함수를 바꿔 끼우고, 해제된 문맥에 입력이 남아 있으면 실패합니다.

  - project: OpenSSL
    repo: openssl/openssl
    pr: 33470
    title:
      en: Clear the derived secret on `EVP_PKEY_derive_SKEY()` failure
      ko: "`EVP_PKEY_derive_SKEY()`가 실패할 때 파생된 공유 비밀 지우기"
    type: hardening
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-01
    decided: null
    defect:
      en: >-
        When the key exchange has no `derive_skey`, `EVP_PKEY_derive_SKEY()` derives into a
        temporary buffer, and its two error paths freed that buffer with `OPENSSL_free()`. Asking
        for more bytes than the shared secret has is enough: X25519 and X448 write the real secret,
        the length check fails, and the shared secret stayed in freed memory.
      ko: >-
        키 교환에 `derive_skey`가 없으면 `EVP_PKEY_derive_SKEY()`는 임시 버퍼에 비밀을 만든 뒤 가져오는데,
        실패하는 두 경로가 이 버퍼를 `OPENSSL_free()`로 해제했습니다. 공유 비밀보다 긴 길이를 요청하기만 해도
        X25519·X448이 실제 비밀을 쓴 뒤 길이 확인에서 실패해, 공유 비밀이 해제된 메모리에 남았습니다.
    background:
      en: >-
        Zeroisation of temporary secrets (ISO/IEC 19790, FIPS 140-3, KCMVP) applied to the new
        `EVP_SKEY` key-exchange API. The success path of the same function already used
        `OPENSSL_clear_free()`; this is the pattern reviewers accepted in #33444.
      ko: >-
        임시 비밀값 제로화 요건(ISO/IEC 19790, FIPS 140-3·KCMVP)을 새 `EVP_SKEY` 키 교환 API에 적용했습니다.
        같은 함수의 성공 경로는 이미 `OPENSSL_clear_free()`를 썼고, #33444에서 리뷰어가 받아들인 것과 같은
        무늬입니다.
    found_by:
      en: >-
        A static scan for secrets freed without clearing listed the two lines; the freed-block
        measurement program then confirmed the X25519 and X448 secrets left at `exchange.c:553`,
        with nothing left when the requested length matched.
      ko: >-
        지우지 않고 해제하는 비밀값을 찾는 정적 스캔이 두 줄을 짚었고, 해제 블록 측정 프로그램으로 X25519·X448
        공유 비밀이 `exchange.c:553`에서 남는 것을 확인했습니다. 길이가 맞는 대조군에서는 0건이었습니다.
    fix:
      en: >-
        `OPENSSL_clear_free()` on both error paths. `test_derive_skey_clears_on_failure` asks for
        twice the X25519 secret length, watches freed blocks and fails if the change is reverted.
      ko: >-
        두 오류 경로 모두 `OPENSSL_clear_free()`로 바꿨습니다. 새 시험 `test_derive_skey_clears_on_failure`는
        X25519 비밀 길이의 두 배를 요청하고 해제 블록을 감시해, 수정을 되돌리면 실패합니다.

  - project: OpenSSL
    repo: openssl/openssl
    pr: 33471
    title:
      en: Clear the previous DHKEM IKM when it is replaced
      ko: DHKEM IKM을 바꿀 때 이전 IKM 지우기
    type: hardening
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-01
    decided: null
    defect:
      en: >-
        The DHKEM IKM on an EC or X25519/X448 key generation context fixes the private key that
        will be generated (RFC 9180 DeriveKeyPair). Setting a new IKM freed the previous copy with
        `OPENSSL_free()`, so a value that recreates the private key stayed in freed memory.
      ko: >-
        EC·X25519/X448 키 생성 문맥에 넣는 DHKEM IKM은 만들어질 개인키를 정하는 씨앗입니다(RFC 9180
        DeriveKeyPair). IKM을 새로 넣으면 이전 사본을 `OPENSSL_free()`로 해제해서, 개인키를 다시 만들 수
        있는 값이 해제된 메모리에 남았습니다.
    background:
      en: >-
        HPKE key derivation (RFC 9180) and the zeroisation of keying material that determines a key
        (ISO/IEC 19790, FIPS 140-3, KCMVP). The generation context's cleanup already cleared the
        IKM; only the replace path did not.
      ko: >-
        HPKE 키 유도(RFC 9180)와, 키를 정하는 재료의 제로화 요건(ISO/IEC 19790, FIPS 140-3·KCMVP)을
        썼습니다. 생성 문맥의 정리 함수는 이미 IKM을 지웠고, 바꿔 넣는 경로만 빠져 있었습니다.
    found_by:
      en: >-
        A static scan for secrets freed without clearing, confirmed with the freed-block measurement
        program: the old 32-byte IKM was left for X25519, X448 and P-256.
      ko: >-
        지우지 않고 해제하는 비밀값 정적 스캔으로 짚고, 해제 블록 측정 프로그램으로 X25519·X448·P-256
        모두에서 이전 32바이트 IKM이 남는 것을 확인했습니다.
    fix:
      en: >-
        `OPENSSL_clear_free()` in `ecx_gen_set_params()` and in the EC `COPY_OCTET_PARAM()` macro.
        `test_ikm_cleared_on_reset` sets the IKM twice and fails if either change is reverted.
      ko: >-
        `ecx_gen_set_params()`와 EC의 `COPY_OCTET_PARAM()` 매크로를 `OPENSSL_clear_free()`로 바꿨습니다.
        새 시험 `test_ikm_cleared_on_reset`은 IKM을 두 번 넣고, 두 수정 중 하나라도 되돌리면 실패합니다.

  - project: OpenSSL
    repo: openssl/openssl
    pr: 33476
    title:
      en: Allocate the PBKDF1 derive_skey buffer without zeroing it
      ko: PBKDF1 derive_skey 버퍼를 0으로 채우지 않고 할당
    type: cleanup
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-02
    decided: null
    defect:
      en: >-
        `kdf_pbkdf1_derive_skey()` allocated the key buffer with `OPENSSL_zalloc()`, but nothing
        reads it before the derivation writes every byte, and on failure it is cleared and freed
        unread. The zero fill was wasted work.
      ko: >-
        `kdf_pbkdf1_derive_skey()`가 키 버퍼를 `OPENSSL_zalloc()`으로 할당했지만, 유도가 모든 바이트를 쓰기
        전에 그 버퍼를 읽는 곳이 없고 실패하면 읽지 않은 채 지우고 해제합니다. 0으로 채우는 일이 쓸모없었습니다.
    background:
      en: >-
        A reviewer pointed this out in #33444 (clearing the PBKDF1 key on failure) and it was left
        for a separate change to keep that PR to its scope.
      ko: >-
        #33444(PBKDF1 키를 실패 때 지우기) 리뷰에서 리뷰어가 짚었고, 그 PR 범위를 지키려고 따로 낸 변경입니다.
    found_by:
      en: Reviewer comment on #33444, checked against every write to the buffer in `kdf_pbkdf1_do_derive()`.
      ko: "#33444 리뷰 지적을 `kdf_pbkdf1_do_derive()`의 버퍼 쓰기 전부와 대조해 확인했습니다."
    fix:
      en: >-
        `OPENSSL_malloc()` instead of `OPENSSL_zalloc()`. Built with `--strict-warnings`;
        `test_evp_kdf` passes, including `test_kdf_pbkdf1_skey`.
      ko: >-
        `OPENSSL_zalloc()` 대신 `OPENSSL_malloc()`을 씁니다. `--strict-warnings` 빌드에서 경고 0, `test_evp_kdf`
        (`test_kdf_pbkdf1_skey` 포함) 통과.

  - project: OpenSSL
    repo: openssl/openssl
    pr: 33477
    title:
      en: A test helper that looks for secrets left in freed memory
      ko: 해제된 메모리에 남은 비밀값을 찾는 시험 도우미
    type: test
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-02
    decided: null
    defect:
      en: >-
        Each test that checks a secret is cleared before its buffer is freed carried its own copy
        of an allocator hook, and on openssl-4.0 and older the allocator cannot be replaced in the
        middle of a test, so such checks could not run there.
      ko: >-
        비밀값을 지운 뒤 해제하는지 보는 시험마다 할당 함수 가로채기 코드를 따로 들고 있었고, openssl-4.0
        이하에서는 시험 도중에 할당 함수를 바꿀 수 없어 그 검사가 돌지 못했습니다.
    background:
      en: >-
        Zeroisation checks for critical security parameters (ISO/IEC 19790, FIPS 140-3, KCMVP),
        turned into a reusable test. A reviewer of #33444 suggested generalising the hook and
        pointed out the 4.0 limitation.
      ko: >-
        핵심 보안 매개변수 제로화 검사(ISO/IEC 19790, FIPS 140-3·KCMVP)를 다시 쓸 수 있는 시험으로 만들었습니다.
        #33444 리뷰어가 가로채기 코드를 일반화하자고 했고 4.0 제약도 짚었습니다.
    found_by:
      en: Review of #33444; the rework followed the reviewer's note on 4.0.
      ko: "#33444 리뷰에서 나왔고, 4.0에 대한 리뷰어 지적을 반영해 다시 만들었습니다."
    fix:
      en: >-
        `test_watch_freed_start()`/`test_watch_freed_stop()` in libtestutil. With
        `OPENSSL_TEST_WATCH_FREED` set, `test/testutil/main.c` installs the hooks at startup, so the
        check runs with or without mfail. `test_kdf_pbkdf1_skey` uses it and fails if the PBKDF1 key
        is freed without clearing.
      ko: >-
        libtestutil에 `test_watch_freed_start()`/`test_watch_freed_stop()`을 넣었습니다.
        `OPENSSL_TEST_WATCH_FREED`를 켜면 `test/testutil/main.c`가 시작할 때 가로채기를 설치해, mfail이 있든
        없든 검사가 돕니다. `test_kdf_pbkdf1_skey`가 이 도우미를 쓰고, PBKDF1 키를 지우지 않고 해제하면 실패합니다.

  - project: oqs-provider
    repo: open-quantum-safe/oqs-provider
    pr: 861
    title:
      en: Clear private key copies before freeing them
      ko: 개인키 사본을 지운 뒤 해제
    type: hardening
    cve: null
    cvss: null
    status: open
    submitted: 2026-10-29
    decided: null
    defect:
      en: >-
        When post-quantum private keys were encoded to or decoded from PKCS#8 DER, and when they were
        exported, oqs-provider freed temporary copies of the key without clearing them. ML-KEM, ML-DSA
        and the other post-quantum private keys stayed in released heap memory.
      ko: >-
        양자내성 개인키를 PKCS#8 DER로 인코딩·디코딩하거나 내보낼(export) 때, oqs-provider가 키의 임시 사본을
        지우지 않고 해제했습니다. ML-KEM·ML-DSA를 비롯한 양자내성 개인키가 해제된 힙 메모리에 남았습니다.
    background:
      en: >-
        How keys travel through an OpenSSL 3 provider, and the zeroisation rule of ISO/IEC 19790
        (FIPS 140-3, KCMVP). `OSSL_PARAM_free()` clears only secure-heap blocks, which is why OpenSSL's
        own `ml_kem_export()` cleanses its parameters before freeing them; oqs-provider had no such step.
      ko: >-
        OpenSSL 3 provider 안에서 키가 오가는 경로와 ISO/IEC 19790(FIPS 140-3·KCMVP)의 제로화 요건을 알아야
        보이는 문제였습니다. `OSSL_PARAM_free()`는 보안 힙 블록만 지웁니다. 그래서 OpenSSL의
        `ml_kem_export()`는 해제 전에 파라미터를 지우는데, oqs-provider에는 이 단계가 없었습니다.
    found_by:
      en: >-
        The freed-block measurement program run over 111 algorithms: 1,377 freed blocks held private
        keys. The fix removes every one on oqs-provider's own paths (55 signature algorithms × 8
        paths); the 823 left come from libcrypto. A second run over the key-exchange paths found the
        export copy for all 56 KEM algorithms.
      ko: >-
        해제 블록 측정 프로그램을 알고리즘 111종에 돌렸습니다. 개인키가 든 해제 블록이 1,377개였고, 수정
        뒤 oqs-provider 자체 경로(서명 55종 × 8개 경로)에서는 0개가 됐습니다. 남은 823개는 libcrypto 몫입니다.
        키 교환 경로를 다시 재서 KEM 56종 전부에서 내보내기 사본을 찾았습니다.
    fix:
      en: >-
        `ASN1_STRING_clear_free()` and `OPENSSL_clear_free()` in the encoder and decoder, and
        `OPENSSL_cleanse()` of the exported parameters before `OSSL_PARAM_free()`. A new test,
        `oqs_privkey_cleanse`, watches freed blocks and fails if any of the changes is reverted.
      ko: >-
        인코더·디코더는 `ASN1_STRING_clear_free()`·`OPENSSL_clear_free()`로 바꾸고, 내보낸 파라미터는
        `OSSL_PARAM_free()` 전에 `OPENSSL_cleanse()`로 지웁니다. 새 시험 `oqs_privkey_cleanse`가 해제 블록을
        감시하고, 수정을 하나라도 되돌리면 실패합니다.

  - project: pkcs11-provider
    repo: openssl-projects/pkcs11-provider
    pr: 813
    title:
      en: Return only the ECDH secret into larger buffers
      ko: 큰 버퍼에도 ECDH 공유 비밀값만 돌려주기
    type: bugfix
    cve: null
    cvss: null
    status: open
    submitted: 2026-10-30
    decided: null
    defect:
      en: >-
        With a PKCS#11 token, `EVP_PKEY_derive()` asked the token for as many bytes as the caller's
        buffer instead of the size of the shared secret. NSS softokn returned the P-256 secret
        left-padded with zeros, so a 64-byte buffer got 32 zero bytes before the secret and the two
        sides of an ECDH exchange no longer agreed.
      ko: >-
        PKCS#11 토큰을 쓰면 `EVP_PKEY_derive()`가 공유 비밀값 크기가 아니라 호출자 버퍼 크기만큼 토큰에
        요청했습니다. NSS softokn은 P-256 비밀값 앞을 0으로 채워 돌려줘서, 64바이트 버퍼에는 0 32개 뒤에
        비밀값이 들어갔고 ECDH 양쪽 값이 서로 달라졌습니다.
    background:
      en: >-
        PKCS#11 and HSM integration: an ECDH derivation (`CKM_ECDH1_DERIVE` with `CKD_NULL`) takes its
        output length from `CKA_VALUE_LEN` in the key template, while OpenSSL's `EVP_PKEY_derive()`
        treats the length as the buffer size and reports how many bytes it wrote.
      ko: >-
        PKCS#11·HSM 연동 지식이 필요했습니다. ECDH 파생(`CKM_ECDH1_DERIVE`, `CKD_NULL`)은 출력 길이를 키
        템플릿의 `CKA_VALUE_LEN`에서 가져오고, OpenSSL `EVP_PKEY_derive()`는 길이를 버퍼 크기로 받아 실제로 쓴
        바이트 수를 돌려줍니다. 두 규약이 어긋나는 지점이었습니다.
    found_by:
      en: >-
        Differential testing: the same ECDH derivation through OpenSSL's default provider and through
        pkcs11-provider on an NSS softokn token, with output buffers of several sizes.
      ko: >-
        차등 시험으로 찾았습니다. 같은 ECDH 파생을 OpenSSL 기본 provider와 NSS softokn 토큰 위의
        pkcs11-provider에 여러 크기의 출력 버퍼로 넣어 결과를 비교했습니다.
    fix:
      en: >-
        Cap the requested length at the key size. The new regression test then exposed an older leak:
        deriving twice on one context overwrote the copy of the peer's public point, which the Address
        Sanitizer job reported. That leak is fixed in the same pull request.
      ko: >-
        요청 길이를 키 크기로 제한했습니다. 새 회귀 시험이 오래된 누수도 드러냈습니다. 한 문맥에서 두 번
        파생하면 상대 공개점 사본을 덮어써 앞 사본이 새는 문제로, Address Sanitizer 시험이 잡았고 같은 PR에서
        고쳤습니다.
    review:
      en: >-
        The maintainer approved the change, then asked for the regression test to be restructured and
        for the Address Sanitizer failure to be fixed; both followed in new commits.
      ko: >-
        메인테이너가 승인한 뒤 회귀 시험 구조 정리와 Address Sanitizer 실패 해결을 요청했고, 두 가지 모두 새
        커밋으로 반영했습니다.

  - project: Mbed TLS
    repo: Mbed-TLS/mbedtls
    pr: 11036
    title:
      en: Reject repeated X.509 extensions that have no parser
      ko: 파서가 없는 X.509 확장이 중복돼도 거부
    type: bugfix
    cve: null
    cvss: null
    status: open
    submitted: 2026-10-30
    decided: null
    defect:
      en: >-
        Mbed TLS rejected a certificate that repeated an extension it parses, but accepted one that
        repeated an extension it skips or hands to a callback.
      ko: >-
        Mbed TLS는 자기가 해석하는 확장이 인증서에 두 번 나오면 거부했지만, 건너뛰거나 콜백에 넘기는 확장이
        두 번 나오면 그대로 받아들였습니다.
    background:
      en: >-
        RFC 5280 section 4.2: a certificate must not include more than one instance of a particular
        extension. Applying that rule needs the DER layout of the extensions sequence, since skipped
        extensions are never decoded.
      ko: >-
        RFC 5280 4.2절은 인증서에 같은 확장을 두 번 넣지 못하게 합니다. 건너뛰는 확장은 해석하지 않으니, 이
        규칙을 적용하려면 확장 목록의 DER 구조를 직접 다뤄야 했습니다.
    found_by:
      en: >-
        Issue #4069, where a maintainer had proposed the approach. Test certificates were generated for
        the missing cases; two of them were wrongly accepted before the fix.
      ko: >-
        메인테이너가 방향을 제시해 둔 이슈 #4069에서 시작했습니다. 빠진 경우마다 시험용 인증서를 만들었고,
        수정 전에는 그중 2개가 잘못 통과했습니다.
    fix:
      en: >-
        When an extension is skipped or passed to the callback, compare its OID with the extensions
        already read and reject a repeat; three new test cases (902/902 in `test_suite_x509parse`).
      ko: >-
        건너뛰거나 콜백에 넘기는 확장도 이미 읽은 확장의 OID와 비교해 중복이면 거부합니다. 시험 3건을
        추가했습니다(`test_suite_x509parse` 902/902).

  - project: mitmproxy
    repo: mitmproxy/mitmproxy
    pr: 8548
    title:
      en: Apply config file options before addons see `--set confdir`
      ko: "`--set confdir`에서도 설정 파일 옵션을 먼저 적용"
    type: bugfix
    cve: null
    cvss: null
    status: open
    submitted: 2026-10-31
    decided: null
    defect:
      en: >-
        With `--set confdir=...`, mitmproxy loaded the CA from that directory before reading
        `cert_passphrase` from the directory's `config.yaml`. An encrypted CA key then failed to load
        and mitmproxy exited at startup (issue #6014, open since 2023).
      ko: >-
        `--set confdir=...`을 주면 mitmproxy가 그 폴더의 `config.yaml`에서 `cert_passphrase`를 읽기 전에 CA부터
        불러왔습니다. 그래서 암호가 걸린 CA 키를 읽지 못해 시작하자마자 종료됐습니다(2023년부터 열린 이슈
        #6014).
    background:
      en: >-
        TLS interception: mitmproxy signs certificates on the fly with its own CA, so the CA private
        key has to load at startup, and an encrypted PKCS#8 key needs its passphrase first. Its option
        manager notifies addons on every update, so the order of updates decides what an addon sees.
      ko: >-
        TLS 가로채기 구조를 알아야 했습니다. mitmproxy는 자체 CA로 인증서를 즉석에서 서명하므로 시작할 때 CA
        개인키를 읽어야 하고, 암호화된 PKCS#8 키는 암호가 먼저 있어야 합니다. 옵션 관리자는 갱신할 때마다
        애드온에 알리므로, 갱신 순서가 애드온이 보는 값을 정합니다.
    found_by:
      en: >-
        Issue #6014 with the maintainer's diagnosis, and a stalled pull request from 2023 that had
        never been reviewed. Reproduced on Linux with an encrypted CA.
      ko: >-
        메인테이너가 원인을 짚어 둔 이슈 #6014와, 2023년 이후 리뷰 없이 멈춘 PR을 보고 골랐습니다. 암호 걸린
        CA로 리눅스에서 재현했습니다.
    fix:
      en: >-
        Work out the `--set` options and the config file on a copy of the options (a copy has no
        subscribers) and apply the result in one update; precedence is unchanged. A new test runs
        mitmdump with an encrypted CA and fails with the old order.
      ko: >-
        `--set` 옵션과 설정 파일을 옵션 사본(구독자가 없음)에서 먼저 합친 뒤 결과를 한 번에 적용합니다.
        우선순위는 그대로입니다. 새 시험은 암호 걸린 CA로 mitmdump를 띄우고, 예전 순서로 되돌리면 실패합니다.

  - project: RustCrypto
    repo: RustCrypto/signatures
    pr: 1493
    title:
      en: "ml-dsa: check Wycheproof verify vectors that have a context"
      ko: "ml-dsa: context가 있는 Wycheproof 검증 벡터도 시험"
    type: test
    cve: null
    cvss: null
    status: merged
    submitted: 2026-10-31
    decided: 2026-10-31
    defect:
      en: >-
        The ML-DSA Wycheproof verification test skipped every case with a context string, so deleting
        the check that rejects contexts longer than 255 bytes left all tests passing.
      ko: >-
        ML-DSA Wycheproof 검증 시험이 context 문자열이 있는 경우를 모두 건너뛰었습니다. 그래서 255바이트보다 긴
        context를 거부하는 검사를 지워도 시험이 전부 통과했습니다.
    background:
      en: >-
        FIPS 204: ML-DSA signing and verification reject a context string longer than 255 bytes.
        The C2SP Wycheproof vectors test exactly that with 7-, 255- and 256-byte contexts.
      ko: >-
        FIPS 204는 ML-DSA 서명과 검증에서 255바이트보다 긴 context를 거부하도록 정합니다. C2SP Wycheproof
        벡터는 7·255·256바이트 context로 바로 이 점을 시험합니다.
    found_by:
      en: >-
        Running the Wycheproof ML-DSA vectors against the crate, then mutation testing: removing the
        length check went unnoticed by every existing test.
      ko: >-
        Wycheproof ML-DSA 벡터를 이 크레이트에 돌려 보고 변이 시험을 했습니다. 길이 검사를 지워도 기존 시험이
        하나도 실패하지 않았습니다.
    fix:
      en: >-
        Run the context cases through `verify_with_context()`. With the length check removed, the
        ML-DSA-44, -65 and -87 tests now fail.
      ko: >-
        context가 있는 경우를 `verify_with_context()`로 돌립니다. 이제 길이 검사를 지우면 ML-DSA-44·65·87
        시험이 실패합니다.

  - project: RustCrypto
    repo: RustCrypto/RSA
    pr: 740
    title:
      en: "wycheproof: test OAEP decryption"
      ko: "wycheproof: OAEP 복호화 벡터 시험 추가"
    type: test
    cve: null
    cvss: null
    status: merged
    submitted: 2026-11-01
    decided: 2026-11-01
    defect:
      en: >-
        The `rsa` crate's Wycheproof tests covered only PKCS#1 v1.5 and PSS signatures. Removing
        any one of three OAEP padding checks (leading zero byte, non-zero bytes before the 0x01
        separator, missing separator) left the whole test suite green.
      ko: >-
        `rsa` 크레이트의 Wycheproof 시험은 PKCS#1 v1.5·PSS 서명만 돌렸습니다. OAEP 패딩 검사 세 가지(첫
        바이트 0, 구분자 0x01 앞의 0 아닌 바이트, 구분자 없음) 중 하나를 빼도 시험이 모두 통과했습니다.
    background:
      en: >-
        RSA-OAEP (RFC 8017) decryption must reject malformed padding without revealing which check
        failed; Wycheproof's OAEP files contain exactly those malformed ciphertexts.
      ko: >-
        RSA-OAEP(RFC 8017) 복호화는 잘못된 패딩을 어느 검사에서 걸렸는지 드러내지 않고 거부해야 합니다.
        Wycheproof OAEP 파일에 바로 그런 잘못된 암호문이 들어 있습니다.
    found_by:
      en: >-
        Mutation testing: each padding check was removed in turn and the existing suite run, then
        the same change was run against the Wycheproof OAEP vectors.
      ko: >-
        변이 시험으로 찾았습니다. 패딩 검사를 하나씩 빼고 기존 시험을 돌린 뒤, 같은 변경을 Wycheproof OAEP
        벡터로 다시 돌렸습니다.
    fix:
      en: >-
        `test_rsa_oaep_decrypt` runs 1098 vectors from 22 files; each of the three mutations makes 21
        of them fail.
      ko: >-
        새 시험 `test_rsa_oaep_decrypt`가 22개 파일의 벡터 1,098개를 돌립니다. 세 변이 모두 그중 21개
        파일에서 실패합니다.

  - project: OpenVPN for Android
    repo: schwabe/ics-openvpn
    pr: 1936
    title:
      en: "Fix duplicated character before a backslash in config lines"
      ko: "설정 줄에서 백슬래시 앞 글자가 두 번 들어가는 문제 수정"
    type: bugfix
    cve: null
    cvss: null
    status: open
    submitted: 2026-11-01
    decided: null
    defect:
      en: >-
        The `.ovpn` importer's tokenizer kept the previous character across loop iterations, so the character before a backslash was stored twice: `ca foo\ bar.crt` became `fooo bar.crt`.
      ko: >-
        `.ovpn` 가져오기의 토큰 분리기가 이전 글자를 반복 사이에 들고 있어서, 백슬래시 앞 글자가 두 번 저장됐습니다. `ca foo\ bar.crt`가 `fooo bar.crt`로 들어갔습니다.
    background:
      en: >-
        OpenVPN's own option tokenizer (`parse_line()` in `options_parse.c`) is the reference the app's Java port has to match.
      ko: >-
        앱의 Java 이식본이 따라야 할 기준은 OpenVPN 본체의 옵션 토큰 분리기(`options_parse.c`의 `parse_line()`)입니다.
    found_by:
      en: >-
        Differential testing of the Java tokenizer against OpenVPN's real `parse_line()` on random option lines.
      ko: >-
        무작위 옵션 줄을 Java 토큰 분리기와 OpenVPN의 실제 `parse_line()`에 함께 넣어 비교해 찾았습니다.
    fix:
      en: >-
        Reset the stored character every iteration, as OpenVPN does; lines split differently by the two dropped from 504 to 0.
      ko: >-
        OpenVPN처럼 매 반복마다 저장 글자를 비웠습니다. 두 쪽이 다르게 나누던 줄이 504개에서 0개가 됐습니다.

  - project: OpenVPN for Android
    repo: schwabe/ics-openvpn
    pr: 1937
    title:
