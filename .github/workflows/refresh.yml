name: Refresh board

# Re-read every pull request on the board from GitHub and rebuild the pages. Commits only when
# the data or the date changed; the push makes GitHub Pages rebuild the site.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Sync with GitHub and rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 sync.py
      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh board from GitHub"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
